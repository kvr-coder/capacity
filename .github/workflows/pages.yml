name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish any branch by hand from the Actions tab, which is how you
  # get a live link for a feature branch before it merges.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a merge that
# lands during a deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        # Pages serves a project site from /<repo>/, so the bundle has to be
        # built against that base or every asset 404s.
        run: VITE_BASE=/${{ github.event.repository.name }}/ npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
